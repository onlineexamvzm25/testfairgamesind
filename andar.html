<section class="game-strip"><div class="lucky"><h3>✦ LUCKY CARD ✦</h3><div class="card" id="luckyCard"></div></div><div class="stock-wrap"><div class="stock" id="stock"></div></div><div class="timer"><h3>BETTING TIME</h3><div class="time" id="timer">15</div><div class="muted" id="timerNote">SECONDS</div></div></section>
<section class="panels"><article class="panel andar" onclick="selectSide('ANDAR')"><h2 class="title">ANDAR</h2><div class="area" id="andarCards"><div class="slot">♠</div></div><label class="radio"><input type="radio" name="side" value="ANDAR" checked> ANDAR</label></article><article class="panel bahar" onclick="selectSide('BAHAR')"><h2 class="title">BAHAR</h2><div class="area" id="baharCards"><div class="slot">♥</div></div><label class="radio"><input type="radio" name="side" value="BAHAR"> BAHAR</label></article></section>
<section class="chipsbox"><div class="chipslabel" id="chipslabel">ANDAR / 5 CHIPS</div><div class="chips"><label class="chipchoice"><input type="radio" name="amount" value="5" checked><span class="chip green">5</span></label><label class="chipchoice"><input type="radio" name="amount" value="50"><span class="chip blue">50</span></label><label class="chipchoice"><input type="radio" name="amount" value="100"><span class="chip gold">100</span></label><label class="chipchoice"><input type="radio" name="amount" value="500"><span class="chip redchip">500</span></label><label class="chipchoice"><input type="radio" name="amount" value="1000"><span class="chip purple">1000</span></label><label class="chipchoice"><input type="radio" name="amount" value="5000"><span class="chip black">5000</span></label></div></section>
<button class="bet" id="bet">BET</button><div class="bet-confirm" id="betConfirm" aria-live="polite"></div><audio id="discardAudio" src="discard.mp3" preload="auto"></audio><div class="status" id="status">Choose a side and chip, then place your demo bet.</div><div class="note">LIVE DATABASE GAME · Balance and results supplied by Supabase</div></main>
<script>
const $ = id => document.getElementById(id);
const SUITS = { 'SPADES':'♠', 'HEARTS':'♥', 'DIAMONDS':'♦', 'CLUBS':'♣', '♠':'♠', '♥':'♥', '♦':'♦', '♣':'♣' };
const RED_SUITS = new Set(['HEARTS','DIAMONDS','♥','♦']);
const SUPABASE_URL = 'https://dbfycihbcosuxxkrmbhl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_aOyXtAbzrrX0Z9jPAU1qEA_0ZnK35BX';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const sessionToken = localStorage.getItem('crdgn_session_token') || '';
let currentRoundId = null, currentRound = null, myBet = null, balance = 0;
let initialStateLoaded = false;
let serverAvailable = false, lastHeartbeatCheckAt = 0;
let uiState = 'LOADING', pollHandle = null, countdownHandle = null, isBetSubmitting = false;
let displayedSequences = new Set(), revealQueue = Promise.resolve(), roundReady = Promise.resolve(), roundAnimationPending = false, lastResultRound = null;
const $sideInputs = () => [...document.querySelectorAll('input[name="side"]')];
const $amountInputs = () => [...document.querySelectorAll('input[name="amount"]')];
function status(message){ $('status').textContent = message; }
function showWaitingForServer(detail=''){
  uiState='WAITING';
  clearInterval(countdownHandle);
  setControls(false);
  $('timer').textContent='—';
  $('timerNote').textContent='SERVER';
  status(detail ? `WAITING FOR SERVER… ${detail}` : 'WAITING FOR SERVER… Please wait.');
}
function fmt(n){ return Number(n || 0).toLocaleString('en-IN'); }
function cardData(c){
  const rawSuit = c.suit || c.suit_symbol || '';
  const suit = SUITS[rawSuit] || rawSuit || '♠';
  const rank = String(c.rank || c.value || '?');
  return {rank, suit, red: c.red !== undefined ? Boolean(c.red) : RED_SUITS.has(rawSuit) || RED_SUITS.has(suit), sequence:Number(c.sequence||0), side:String(c.side||'').toUpperCase()};
}
function showCard(c, cls='card'){
  c=cardData(c);
  return `<div class="${cls} ${c.red?'red':''}"><span class="card-value">${c.rank}</span><span class="suit small-suit top-suit">${c.suit}</span><span class="suit small-suit bottom-suit">${c.suit}</span></div>`;
}
function stock(n){
  const box=$('stock'); box.innerHTML='';
  const label=document.createElement('div'); label.className='stock-label'; label.innerHTML=`STOCK · <span id="stockCount">${Math.max(0,Number(n)||0)}</span>`;
  const pack=document.createElement('div'); pack.className='stockcard'; pack.setAttribute('aria-label','Face-down stock deck'); box.append(label,pack);
}
function updateStockCount(n){const countEl=$('stockCount');if(countEl)countEl.textContent=String(Math.max(0,Number(n)||0));}
function playDealSound(luckySound=false){
  if(!luckySound){const audio=$('discardAudio');if(audio){try{audio.currentTime=0;const p=audio.play();if(p?.catch)p.catch(()=>{});}catch(e){}}}
  beep(luckySound?920:560,luckySound?.16:.065);
}
function flyFromStockTo(target,onArrive,luckySound=false,duration=2000){
  const pack=$('stock').querySelector('.stockcard')||$('stock');
  const sr=pack.getBoundingClientRect(), tr=target.getBoundingClientRect();
  const w=36,h=51,x=sr.left+sr.width/2-w/2,y=sr.top+sr.height/2-h/2,ex=tr.left+tr.width/2-w/2,ey=tr.top+tr.height/2-h/2;
  const flyer=document.createElement('div'); flyer.className='flying-card';
  Object.assign(flyer.style,{width:w+'px',height:h+'px',left:x+'px',top:y+'px',transform:'translate3d(0,0,0)',opacity:'1',transition:'none',willChange:'transform,opacity'});
  document.body.appendChild(flyer); void flyer.offsetWidth; playDealSound(luckySound);
  let done=false, fallback;
  const finish=()=>{if(done)return;done=true;clearTimeout(fallback);flyer.removeEventListener('transitionend',end);flyer.remove();onArrive();};
  const end=e=>{if(e.target===flyer&&e.propertyName==='transform')finish();}; flyer.addEventListener('transitionend',end);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{if(done||!flyer.isConnected)return;flyer.style.transition=`transform ${duration}ms cubic-bezier(.22,.61,.36,1), opacity ${duration}ms ease-out`;flyer.style.transform=`translate3d(${ex-x}px,${ey-y}px,0) rotate(${luckySound?180:8}deg) scale(.98)`;flyer.style.opacity='.98';}));
  fallback=setTimeout(finish,duration+500);
}
function beep(f=600,d=.05){try{const c=beep.ctx||(beep.ctx=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.03;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
function selectedSide(){return document.querySelector('input[name="side"]:checked')?.value||'ANDAR';}
function selectedAmount(){return Number(document.querySelector('input[name="amount"]:checked')?.value||5);}
function updateBetLabel(){ $('chipslabel').textContent=`${selectedSide()} / ${fmt(selectedAmount())} CHIPS`; }
function selectSide(value){if(uiState!=='BETTING'||myBet||isBetSubmitting)return;document.querySelector(`input[name="side"][value="${value}"]`).checked=true;updateBetLabel();}
$sideInputs().forEach(x=>x.addEventListener('change',updateBetLabel));
$amountInputs().forEach(x=>x.addEventListener('change',updateBetLabel));
function setControls(enabled){const can=enabled&&uiState==='BETTING'&&!myBet&&!isBetSubmitting&&!roundAnimationPending;$sideInputs().forEach(x=>x.disabled=!can);$amountInputs().forEach(x=>x.disabled=!can);$('bet').disabled=!can;}
function setBalance(v){balance=Number(v||0);$('balance').textContent=fmt(balance);}
function setPlayer(name,userId){const n=name||localStorage.getItem('crdgn_user_name')||'PLAYER';$('playerName').textContent=n;$('playerAvatar').textContent=(n.trim()[0]||'P').toUpperCase();$('playerId').textContent=userId?String(userId).slice(0,8):'—';}
function resetSlots(){resetCardSlots($('andarCards'),'♠');resetCardSlots($('baharCards'),'♥');}
function resetCardSlots(area,symbol){area.innerHTML='';for(let i=0;i<2;i++){const cell=document.createElement('div');cell.className='slot';cell.dataset.symbol=symbol;area.appendChild(cell);}}
function createMiniCard(c){c=cardData(c);const el=document.createElement('div');el.className='mini current'+(c.red?' red':'');el.innerHTML=`<span class="pip">${c.suit}</span><span class="rank">${c.rank}</span><span class="corner">${c.suit}</span>`;return el;}
function shiftTwoCards(area,which){const cells=[...area.querySelectorAll('.slot')];if(which==='ANDAR'){cells[0].replaceChildren();if(cells[1].firstElementChild)cells[0].appendChild(cells[1].firstElementChild);cells[1].replaceChildren();}else{cells[1].replaceChildren();if(cells[0].firstElementChild)cells[1].appendChild(cells[0].firstElementChild);cells[0].replaceChildren();}}
function renderReveal(c, instant=false){
  c=cardData(c); if(!c.side||!c.sequence||displayedSequences.has(c.sequence))return Promise.resolve();
  displayedSequences.add(c.sequence);
  const show = () => {
    const side=c.side==='ANDAR'?'ANDAR':'BAHAR', area=$(side==='ANDAR'?'andarCards':'baharCards'), cells=[...area.querySelectorAll('.slot')];
    area.querySelectorAll('.mini.current').forEach(el=>el.classList.remove('current'));shiftTwoCards(area,side);
    const destination=side==='ANDAR'?cells[1]:cells[0];
    if(instant){destination.replaceChildren(createMiniCard(c));updateStockCount(Math.max(0,51-c.sequence));return Promise.resolve();}
    return new Promise(resolve=>{
      // The server reveals cards at about 800ms intervals; keep the flight within that cadence.
      flyFromStockTo(destination,()=>{destination.replaceChildren(createMiniCard(c));updateStockCount(Math.max(0,51-c.sequence));resolve();},false,700);
    });
  };
  if(instant)return show();
  revealQueue=revealQueue.then(()=>roundReady).then(show);
  return revealQueue;
}
async function animateNewRound(round){
  await animateStockShuffle();
  if(!currentRound||Number(currentRound.round_id)!==Number(round.round_id))return;
  const c={rank:round.lucky_card_rank,suit:round.lucky_card_suit};
  const target=$('luckyCard');
  await new Promise(resolve=>flyFromStockTo(target,()=>{target.innerHTML=showCard(c,'card lucky-glow');resolve();},true,700));
}
function animateStockShuffle(){return new Promise(resolve=>{
  const box=$('stock');box.querySelectorAll('.shuffle-card').forEach(e=>e.remove());const pack=box.querySelector('.stockcard');if(pack)pack.style.opacity='0';
  const cards=[];for(let i=0;i<52;i++){const c=document.createElement('div');c.className='shuffle-card';c.style.zIndex=String(10+i%8);c.style.opacity='0';box.appendChild(c);cards.push(c);}
  const start=performance.now(),duration=1650;const frame=now=>{const t=Math.min(1,(now-start)/duration);cards.forEach((c,i)=>{const phase=(i%13)/13,lane=i%2===0?-1:1,spread=(1-t)*18+3,wave=Math.sin(t*Math.PI*8+phase*Math.PI*2);c.style.opacity=String(t<.12?t/.12:t>.88?(1-t)/.12:.78);c.style.transform=`translate3d(${lane*(Math.abs(wave)*spread+((i%5)-2)*1.2)}px,${Math.cos(t*Math.PI*8+phase*Math.PI*2)*7+((i%7)-3)*.45}px,0) rotate(${lane*(Math.abs(wave)*18+((i%3)-1)*3)}deg)`;});if(t<1)requestAnimationFrame(frame);else{cards.forEach(c=>c.remove());if(pack)pack.style.opacity='1';resolve();}};requestAnimationFrame(frame);
});}
function setTimerFromDeadline(deadline){clearInterval(countdownHandle);if(!deadline){$('timer').textContent='—';return;}const end=new Date(deadline).getTime();const tick=()=>{const sec=Math.max(0,Math.ceil((end-Date.now())/1000));$('timer').textContent=String(sec);if(sec<=0)clearInterval(countdownHandle);};tick();countdownHandle=setInterval(tick,250);}
function renderMyBet(bet){myBet=bet||null;if(myBet){$('betConfirm').textContent=`BET CONFIRMED · ${myBet.selected_side} — ${fmt(myBet.bet_amount)} CHIPS`;$('betConfirm').classList.add('show');}else{$('betConfirm').textContent='';$('betConfirm').classList.remove('show');}}
async function checkWorkerHeartbeat(force=false){
  const now=Date.now();
  // Check heartbeat at most every 1.5 seconds while game state may poll faster.
  if(!force && lastHeartbeatCheckAt && now-lastHeartbeatCheckAt<1500) return serverAvailable;
  lastHeartbeatCheckAt=now;
  const {data,error}=await supabaseClient.rpc('crdgab_get_worker_status');
  if(error){console.error('crdgab_get_worker_status:',error);serverAvailable=false;return false;}
  const row=Array.isArray(data)?data[0]:data;
  serverAvailable=!!row?.server_available;
  return serverAvailable;
}
async function syncState(){
  if(!sessionToken){status('Login session not found. Returning to login…');setTimeout(()=>location.replace('index.html'),700);return;}
  const workerAlive=await checkWorkerHeartbeat();
  if(!workerAlive){showWaitingForServer('Game processor is not responding. Please wait.');return;}
  const {data,error}=await supabaseClient.rpc('crdgab_get_state',{p_session_token:sessionToken});
  if(error){console.error('crdgab_get_state:',error);showWaitingForServer('Connection or game-state check failed.');return;}
  const result=Array.isArray(data)?data[0]:data;
  if(!result?.success){const msg=result?.message||'Session validation failed. Please log in again.';if(/session/i.test(msg)){showWaitingForServer('Login session expired.');setTimeout(()=>location.replace('index.html'),900);}else{showWaitingForServer(msg);}return;}
  setPlayer(result.user_name,localStorage.getItem('crdgn_user_id'));setBalance(result.balance);
  const r=result.round;
  if(!r){initialStateLoaded=true;uiState='WAITING';currentRound=null;myBet=null;setControls(false);stock(52);$('timer').textContent='—';$('timerNote').textContent='WAITING';showWaitingForServer('No active round is available yet.');return;}
  // Use the date-wise number for messages; keep round_id for all database identity.
  const displayRoundNo = r.daily_round_no ?? r.round_id;
  const isNew=Number(r.round_id)!==Number(currentRoundId);
  const restoreExistingRound=isNew&&!initialStateLoaded;
  if(isNew){
    // Clear the previous round's winner highlight as soon as a new round arrives.
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('winner'));
    initialStateLoaded=true;currentRoundId=r.round_id;currentRound=r;myBet=null;displayedSequences=new Set();revealQueue=Promise.resolve();resetSlots();$('betConfirm').classList.remove('show');$('betConfirm').textContent='';
    if(restoreExistingRound){
      // Page opened mid-round: restore the server's current state without replaying the shuffle/deal animations.
      roundAnimationPending=false;roundReady=Promise.resolve();stock(Math.max(0,51-Number(r.revealed_count||0)));
      $('luckyCard').innerHTML=showCard({rank:r.lucky_card_rank,suit:r.lucky_card_suit},'card lucky-glow');
      uiState=r.status==='BETTING'?'BETTING':r.status==='DEALING'?'DEALING':'RESULT';
    }else{
      roundAnimationPending=true;stock(51);$('luckyCard').innerHTML='<span class="corner">?</span><span class="suit">✦</span><span class="corner b">?</span>';uiState='SHUFFLING';$('timer').textContent='SHUFFLE';$('timerNote').textContent='PREPARING DECK';status(`Round ${displayRoundNo}: shuffling cards…`);roundReady=animateNewRound(r).finally(()=>{roundAnimationPending=false;setControls(uiState==='BETTING'&&!myBet);});
    }
  }
  currentRound=r;renderMyBet(result.my_bet);
  const revealedCards=Array.isArray(r.revealed_cards)?r.revealed_cards:[];
  for(const c of revealedCards) renderReveal(c,restoreExistingRound);
  if(r.status==='BETTING'){
    uiState='BETTING';$('timerNote').textContent='SECONDS';setTimerFromDeadline(r.betting_ends_at);setControls(true);
    if(myBet){setControls(false);status(`Bet confirmed: ${myBet.selected_side} — ${fmt(myBet.bet_amount)} chips.`);}else status(`Round ${displayRoundNo}: place your bet.`);
  }else if(r.status==='DEALING'){
    uiState='DEALING';clearInterval(countdownHandle);$('timer').textContent='DEAL';$('timerNote').textContent='IN PROGRESS';setControls(false);status(`Round ${displayRoundNo}: dealing cards…`);
  }else if(r.status==='RESULT'||r.status==='COMPLETED'){
    uiState='RESULT';clearInterval(countdownHandle);$('timer').textContent=r.winning_side||'RESULT';$('timerNote').textContent='WINS';setControls(false);
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('winner'));if(r.winning_side)document.querySelector('.panel.'+r.winning_side.toLowerCase())?.classList.add('winner');
    if(lastResultRound!==r.round_id){lastResultRound=r.round_id;status(r.winning_side?`Round ${displayRoundNo}: ${r.winning_side} wins!`:`Round ${displayRoundNo} completed.`);beep(880,.18);}
  }
  const count=Number(r.revealed_count||0);updateStockCount(Math.max(0,51-count));
}
async function placeBet(){
  if(uiState!=='BETTING'||myBet||isBetSubmitting)return;
  const token=localStorage.getItem('crdgn_session_token');if(!token){status('Login session missing.');return;}
  isBetSubmitting=true;setControls(false);$('bet').textContent='PLACING…';
  try{
    if(!currentRound?.round_id)throw new Error('No active round is available.');
    const {data,error}=await supabaseClient.rpc('crdgab_place_bet',{p_session_token:token,p_round_id:Number(currentRound.round_id),p_selected_side:selectedSide(),p_bet_amount:selectedAmount()});
    if(error)throw error;const result=Array.isArray(data)?data[0]:data;
    if(!result?.success){status(result?.message||'Bet was not accepted.');await syncState();return;}
    if(result.balance_after!==undefined)setBalance(result.balance_after);
    renderMyBet({selected_side:result.selected_side,bet_amount:result.bet_amount,bet_status:'ACCEPTED'});
    status(`BET CONFIRMED: ${result.selected_side} — ${fmt(result.bet_amount)} CHIPS`);beep(520,.1);
  }catch(e){console.error('Bet error:',e);status(e.message||'Unable to place bet.');await syncState();}
  finally{$('bet').textContent='BET';isBetSubmitting=false;setControls(uiState==='BETTING'&&!myBet);}
}
function goHome(){location.href='homepage.html';}
$('bet').addEventListener('click',placeBet);updateBetLabel();
if(!window.supabase){showWaitingForServer('Supabase client failed to load. Check internet connection.');}
else if(!sessionToken){status('Login required. Redirecting…');setTimeout(()=>location.replace('index.html'),700);}
else{syncState().catch(e=>{console.error(e);showWaitingForServer('Unable to connect.');});pollHandle=setInterval(()=>syncState().catch(e=>{console.error(e);showWaitingForServer('Unable to connect.');}),500);}
</script></body></html>
